openapi: 3.1.0
info:
  title: Forge3D Cloud API
  version: 0.1.0
  description: |
    API de geração de armas e assets 3D para Roblox.

    **Estado (F0):** estão especificados apenas os endpoints já implementados.
    `POST /v1/generate` valida e autentica a requisição, mas responde 503 até que
    a persistência e a fila (F1/F2) estejam ligadas. Os demais endpoints da seção 5.1
    do documento mestre serão adicionados à medida que forem implementados.
servers:
  - url: https://{host}
    variables:
      host:
        default: forge3d-cloud.vercel.app
        description: Substituir pelo domínio real do deploy na Vercel.
paths:
  /health:
    get:
      summary: Health check (liveness)
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Processo ativo.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /ready:
    get:
      summary: Readiness
      operationId: getReady
      security: []
      description: Retorna 503 enquanto a configuração ou dependências obrigatórias não estiverem prontas. Lista apenas nomes de variáveis, nunca valores.
      responses:
        "200": { description: Pronto. }
        "503": { description: Não pronto. }
  /v1/generate:
    post:
      summary: Criar geração
      operationId: createGeneration
      security:
        - forgeHmac: []
      parameters:
        - { $ref: "#/components/parameters/ForgeKeyId" }
        - { $ref: "#/components/parameters/ForgeTimestamp" }
        - { $ref: "#/components/parameters/ForgeNonce" }
        - { $ref: "#/components/parameters/ForgeSignature" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateRequest" }
      responses:
        "202":
          description: Job aceito.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    forgeHmac:
      type: apiKey
      in: header
      name: X-Forge-Signature
      description: |
        HMAC-SHA256 em hexadecimal de `timestamp + "." + nonce + "." + rawBody`.
        `X-Forge-Timestamp` é epoch em segundos (tolerância de 30 s) e
        `X-Forge-Nonce` é único por requisição (16–128 caracteres [A-Za-z0-9_-]).
  parameters:
    ForgeKeyId:
      { name: X-Forge-Key-Id, in: header, required: true, schema: { type: string } }
    ForgeTimestamp:
      { name: X-Forge-Timestamp, in: header, required: true, schema: { type: string, pattern: "^\\d{1,12}$" } }
    ForgeNonce:
      { name: X-Forge-Nonce, in: header, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" } }
    ForgeSignature:
      { name: X-Forge-Signature, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
  responses:
    Problem:
      description: Erro (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        trace_id: { type: string }
    GenerateRequest:
      type: object
      required: [player, weapon_description, category, style, idempotency_key]
      properties:
        player:
          type: object
          required: [user_id, username]
          properties:
            user_id: { type: integer, minimum: 1 }
            username: { type: string, minLength: 1, maxLength: 64 }
        weapon_description: { type: string, minLength: 3, maxLength: 1000 }
        category: { type: string, pattern: "^[a-z][a-z0-9_-]*(\\.[a-z][a-z0-9_-]*)+$", examples: [melee.sword] }
        style: { type: string, pattern: "^[a-z][a-z0-9_-]*(\\.[a-z][a-z0-9_-]*)+$", examples: [sci-fi.cyberpunk] }
        preset_prompt_id: { type: string, examples: [roblox.default.v3] }
        constraints:
          type: object
          properties:
            max_tris: { type: integer, minimum: 500, maximum: 100000 }
            rarity: { type: string, enum: [common, uncommon, rare, epic, legendary, mythic] }
            level: { type: integer, minimum: 1, maximum: 1000 }
            quality: { type: string, enum: [low, medium, high, ultra, cinematic], default: high }
        idempotency_key: { type: string, format: uuid }
    GenerateResponse:
      type: object
      required: [job_id, status, progress, status_url, stream_url]
      properties:
        job_id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
        status: { type: string, enum: [queued, running, waiting_capacity, succeeded, failed, cancelled] }
        progress: { type: number, minimum: 0, maximum: 100 }
        status_url: { type: string }
        stream_url: { type: string }
