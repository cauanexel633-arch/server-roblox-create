openapi: 3.1.0
info:
  title: Forge3D Cloud API
  version: 2.0.0
  description: Serverless procedural Roblox asset generation API.
servers:
  - url: https://YOUR_VERCEL_DOMAIN
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: Service healthy }
  /ready:
    get:
      summary: Dependency readiness
      responses:
        "200": { description: Ready }
        "503": { description: Dependencies unavailable }
  /v1/generate:
    post:
      summary: Create a generation job
      security: [{ ForgeHmac: [] }]
      parameters:
        - in: header
          name: X-Forge-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player, weapon_description, idempotency_key]
              properties:
                player: { type: object, required: [user_id], properties: { user_id: { oneOf: [{type: string},{type: integer}] }, username: {type: string} } }
                weapon_description: { type: string, minLength: 8, maxLength: 4000 }
                category: { type: string, default: melee.sword }
                style: { type: string, default: fantasy }
                idempotency_key: { type: string, format: uuid }
      responses:
        "202": { description: Job queued }
        "400": { description: Invalid request }
        "401": { description: HMAC rejected }
  /v1/jobs/{id}:
    get:
      summary: Get job status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Forge-Tenant-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Job status }
        "404": { description: Not found }
  /v1/jobs/{id}/cancel:
    post:
      summary: Cancel a job
      responses:
        "200": { description: Cancellation accepted }
  /v1/weapons/{id}/package:
    get:
      summary: Retrieve signed package artifact URLs
      responses:
        "200": { description: Package artifacts }
components:
  securitySchemes:
    ForgeHmac:
      type: apiKey
      in: header
      name: X-Forge-Signature
